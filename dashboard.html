<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Ashkan Café</title><meta name="description" content="Dashboard در Ashkan Café"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/v3.css"><link rel="stylesheet" href="css/premium.css"><script defer src="js/v3.js"></script><script defer src="js/i18n.js"></script><script defer src="js/premium.js"></script><script defer src="js/assistant.js"></script><script>try{document.documentElement.lang=localStorage.getItem("lang")==="fa"?"fa":"en";document.documentElement.dir=document.documentElement.lang==="fa"?"rtl":"ltr"}catch(e){}</script><link rel="stylesheet" href="css/stage4.css"><link rel="stylesheet" href="css/stage5.css"></head><body><main><section><div class="container"><span class="eyebrow">CUSTOMER DASHBOARD</span><h1>پنل مشتری</h1><div class="stats"><div class="stat"><b id="uname">مهمان</b><div class="muted">پروفایل</div></div><div class="stat"><b id="points">۰</b><div class="muted">امتیاز باشگاه</div></div><div class="stat"><b id="ordersCount">۰</b><div class="muted">سفارش</div></div><div class="stat"><b id="reserveCount">۰</b><div class="muted">رزرو</div></div></div><section><div class="grid"><div class="panel"><h2>تاریخچه سفارش‌ها</h2><div id="orders" class="timeline"></div></div><div class="panel"><h2>رزروهای من</h2><div id="reserves" class="timeline"></div></div><div class="panel"><h2>باشگاه مشتریان</h2><p>هر خرید امتیاز دارد؛ با رسیدن به سطوح بالاتر، تخفیف و نوشیدنی هدیه دریافت می‌کنی.</p><progress max="1000" value="320" style="width:100%"></progress><p class="muted">۳۲۰ از ۱۰۰۰ امتیاز تا سطح بعدی</p></div></div></section></div></section><script>document.addEventListener('DOMContentLoaded',()=>{let u=get('ac_user',{name:'مهمان',points:0}),o=get('ac_orders',[]),r=get('ac_reservations',[]);document.querySelector('#uname').textContent=u.name;document.querySelector('#points').textContent=u.points;document.querySelector('#ordersCount').textContent=o.length;document.querySelector('#reserveCount').textContent=r.length;document.querySelector('#orders').innerHTML=o.map(x=>`<div class="order"><b>${x.id}</b><span class="badge">${x.status}</span><div class="muted">${x.date}</div></div>`).join('')||'<p class="muted">هنوز سفارشی ثبت نشده.</p>';document.querySelector('#reserves').innerHTML=r.map(x=>`<div class="order"><b>میز ${x.table}</b> — ${x.date} ${x.time}<div class="badge">${x.status}</div></div>`).join('')||'<p class="muted">رزروی ندارید.</p>'})</script></main></body></html>
