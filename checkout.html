<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Ashkan Café</title><meta name="description" content="Checkout در Ashkan Café"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/v3.css"><link rel="stylesheet" href="css/premium.css"><script defer src="js/v3.js"></script><script defer src="js/i18n.js"></script><script defer src="js/premium.js"></script><script defer src="js/assistant.js"></script><script>try{document.documentElement.lang=localStorage.getItem("lang")==="fa"?"fa":"en";document.documentElement.dir=document.documentElement.lang==="fa"?"rtl":"ltr"}catch(e){}</script><link rel="stylesheet" href="css/stage4.css"><link rel="stylesheet" href="css/stage5.css"></head><body><main><section><div class="container"><span class="eyebrow">SECURE CHECKOUT</span><h1>تسویه حساب چندمرحله‌ای</h1><div class="steps"><div class="step active">۱. تحویل</div><div class="step">۲. پرداخت</div><div class="step">۳. تأیید</div></div><div class="panel" id="checkoutBox"><div class="form-grid"><label class="field">نوع سفارش<select id="delivery"><option>دریافت حضوری</option><option>ارسال</option></select></label><label class="field">نام<input id="cname" required></label><label class="field">موبایل<input id="phone" inputmode="tel"></label><label class="field">کد تخفیف<input id="coupon" placeholder="CAFE10"></label><label class="field" style="grid-column:1/-1">آدرس<textarea id="address"></textarea></label></div><button class="btn" id="nextPay">مرحله پرداخت</button></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>document.querySelector('#nextPay').onclick=()=>{let c=get('ac_cart',[]);if(!c.length)return toast('سبد خرید خالی است');let code=document.querySelector('#coupon').value.trim().toUpperCase(),disc=code==='CAFE10'?10:0;document.querySelector('#checkoutBox').innerHTML=`<h2>روش پرداخت</h2><div class="grid"><button class="panel">💳 کارت بانکی</button><button class="panel">💵 پرداخت در کافه</button><button class="panel">🎁 Gift Card</button></div><p>تخفیف: ${disc}%</p><button class="btn" id="payNow">ثبت سفارش</button>`;document.querySelector('#payNow').onclick=()=>{let orders=get('ac_orders',[]);orders.unshift({id:'AC'+Date.now().toString().slice(-6),date:new Date().toLocaleDateString('fa-IR'),items:c,status:'در حال آماده‌سازی',discount:disc});set('ac_orders',orders);set('ac_cart',[]);document.querySelector('#checkoutBox').innerHTML='<h2>✓ سفارش ثبت شد</h2><p>سفارش شما با موفقیت دریافت شد و در پنل کاربری قابل پیگیری است.</p><a class="btn" href="dashboard.html">پیگیری سفارش</a>';renderCart()}})</script></main></body></html>
