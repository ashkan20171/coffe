<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Ashkan Café</title><meta name="description" content="Checkout در Ashkan Café"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/v3.css"><link rel="stylesheet" href="css/premium.css"><script defer src="js/v3.js"></script><script defer src="js/i18n.js"></script><script defer src="js/premium.js"></script><script defer src="js/assistant.js"></script><script>try{document.documentElement.lang=localStorage.getItem("lang")==="fa"?"fa":"en";document.documentElement.dir=document.documentElement.lang==="fa"?"rtl":"ltr"}catch(e){}</script><link rel="stylesheet" href="css/stage4.css"><link rel="stylesheet" href="css/stage5.css"><link rel="stylesheet" href="css/stage8.css"><link rel="stylesheet" href="css/stage9.css"></head><body>
<header class="top"><div class="container nav"><a class="brand" href="index.html" aria-label="Ashkan Café home">Ashkan Café</a><button class="mobile-menu-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open navigation">☰</button><nav class="navlinks" id="primary-navigation" aria-label="Primary navigation"><a href="index.html#menu">منو</a><a href="events.html">رویدادها</a><a href="blog.html">مجله</a><a href="gift-card.html">کارت هدیه</a><a href="dashboard.html">پنل من</a></nav><div class="actions"><button class="iconbtn" id="langBtn">FA/EN</button><button class="iconbtn" id="themeBtn">◐</button><a class="iconbtn" href="auth.html">♙</a><button class="btn" id="cartBtn">سبد <span id="cartCount">0</span></button></div></div></header><aside id="cartDrawer" class="drawer"><div class="row between"><h2>سبد خرید</h2><button class="iconbtn" id="closeCart">×</button></div><div id="cartItems"></div><div class="row between"><b>جمع</b><b id="cartTotal"></b></div><a class="btn" style="width:100%;margin-top:16px" href="checkout.html">ادامه و تسویه</a></aside>
<main><section><div class="container"><span class="eyebrow">SECURE CHECKOUT</span><h1>تسویه حساب چندمرحله‌ای</h1><div class="steps"><div class="step active">۱. تحویل</div><div class="step">۲. پرداخت</div><div class="step">۳. تأیید</div></div><div class="panel" id="checkoutBox"><div class="form-grid"><label class="field">نوع سفارش<select id="delivery"><option>دریافت حضوری</option><option>ارسال</option></select></label><label class="field">نام<input id="cname" required></label><label class="field">موبایل<input id="phone" inputmode="tel"></label><label class="field">کد تخفیف<input id="coupon" placeholder="CAFE10"></label><label class="field" style="grid-column:1/-1">آدرس<textarea id="address"></textarea></label></div><button class="btn" id="nextPay">مرحله پرداخت</button></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>document.querySelector('#nextPay').onclick=()=>{let c=get('ac_cart',[]);if(!c.length)return toast('سبد خرید خالی است');let code=document.querySelector('#coupon').value.trim().toUpperCase(),disc=code==='CAFE10'?10:0;document.querySelector('#checkoutBox').innerHTML=`<h2>روش پرداخت</h2><div class="grid"><button class="panel">💳 کارت بانکی</button><button class="panel">💵 پرداخت در کافه</button><button class="panel">🎁 Gift Card</button></div><p>تخفیف: ${disc}%</p><button class="btn" id="payNow">ثبت سفارش</button>`;document.querySelector('#payNow').onclick=()=>{let orders=get('ac_orders',[]);orders.unshift({id:'AC'+Date.now().toString().slice(-6),date:new Date().toLocaleDateString('fa-IR'),items:c,status:'در حال آماده‌سازی',discount:disc});set('ac_orders',orders);set('ac_cart',[]);document.querySelector('#checkoutBox').innerHTML='<h2>✓ سفارش ثبت شد</h2><p>سفارش شما با موفقیت دریافت شد و در پنل کاربری قابل پیگیری است.</p><a class="btn" href="dashboard.html">پیگیری سفارش</a>';renderCart()}})</script></main><div id="toast" class="toast"></div><footer class="footer"><div class="container row between"><b>Ashkan Café</b><span class="muted">© 2026 — تجربه دیجیتال کافه</span><div class="row"><a href="qr-menu.html">QR Menu</a><a href="index.html#reserve">رزرو</a></div></div></footer>
</body></html>
