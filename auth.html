<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auth | Ashkan Café</title><meta name="description" content="Auth در Ashkan Café"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/v3.css"><link rel="stylesheet" href="css/premium.css"><script defer src="js/v3.js"></script><script defer src="js/i18n.js"></script><script defer src="js/premium.js"></script><script defer src="js/assistant.js"></script><script>try{document.documentElement.lang=localStorage.getItem("lang")==="fa"?"fa":"en";document.documentElement.dir=document.documentElement.lang==="fa"?"rtl":"ltr"}catch(e){}</script><link rel="stylesheet" href="css/stage4.css"><link rel="stylesheet" href="css/stage5.css"></head><body><main><section><div class="container" style="max-width:720px"><span class="eyebrow">MEMBER AREA</span><h1>ورود / ثبت‌نام</h1><form class="panel" id="auth"><div class="form-grid"><label class="field">نام و نام خانوادگی<input id="name" required></label><label class="field">ایمیل<input id="email" type="email" required></label><label class="field">موبایل<input></label><label class="field">رمز عبور<input type="password" required></label></div><label class="row"><input type="checkbox"> قوانین باشگاه مشتریان را می‌پذیرم</label><button class="btn">ورود / ساخت حساب</button></form></div></section><script>document.addEventListener('DOMContentLoaded',()=>document.querySelector('#auth').onsubmit=e=>{e.preventDefault();set('ac_user',{name:document.querySelector('#name').value,email:document.querySelector('#email').value,points:320,tier:'Bronze'});location.href='dashboard.html'})</script></main></body></html>
