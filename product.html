<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Ashkan Café</title><meta name="description" content="Product در Ashkan Café"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/v3.css"><script defer src="js/v3.js"></script><script defer src="js/i18n.js"></script></head><body><main><section><div class="container" id="productDetail"></div></section><section><div class="container"><h2>نظر مشتریان</h2><div class="grid"><div class="panel"><div class="stars">★★★★★</div><b>سارا</b><p class="muted">کیفیت قهوه عالی و بالانس طعم خیلی خوب بود.</p></div><div class="panel"><div class="stars">★★★★★</div><b>آرمان</b><p class="muted">بسته‌بندی و آماده‌سازی سریع.</p></div><form class="panel" id="reviewForm"><h3>ثبت Review</h3><label class="field">امتیاز<select><option>5</option><option>4</option><option>3</option></select></label><label class="field">نظر<textarea required></textarea></label><button class="btn">ثبت نظر</button></form></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>{let id=+new URLSearchParams(location.search).get('id')||1,p=products.find(x=>x.id===id),b=document.querySelector('#productDetail');b.innerHTML=`<div class="hero-grid"><img src="${p.img}" alt="${p.n}"><div><span class="badge">★ ${p.rate}</span><h1>${p.n}</h1><p>${p.d}</p><h2 class="price">${money(p.p)}</h2><div class="chips"><span class="chip">Arabica</span><span class="chip">Medium Roast</span><span class="chip">Fresh</span></div><button class="btn" style="margin-top:20px" onclick="addCart(${p.id})">افزودن به سبد</button></div></div>`;document.querySelector('#reviewForm').onsubmit=e=>{e.preventDefault();toast('نظر شما ثبت شد');e.target.reset()}})</script></main></body></html>
