<header class="top"><div class="container nav"><a class="brand" href="index.html" aria-label="Ashkan Café home">Ashkan Café</a><button class="mobile-menu-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open navigation">☰</button><nav class="navlinks" id="primary-navigation" aria-label="Primary navigation"><a href="index.html#menu">منو</a><a href="events.html">رویدادها</a><a href="blog.html">مجله</a><a href="gift-card.html">کارت هدیه</a><a href="dashboard.html">پنل من</a></nav><div class="actions"><button class="iconbtn" id="langBtn" type="button" aria-label="Switch language">FA/EN</button><button class="iconbtn" type="button" id="themeBtn">◐</button><a class="iconbtn" href="auth.html">♙</a><button class="btn" type="button" id="cartBtn">سبد <span id="cartCount">0</span></button></div></div></header><aside id="cartDrawer" class="drawer"><div class="row between"><h2>سبد خرید</h2><button class="iconbtn" id="closeCart">×</button></div><div id="cartItems"></div><div class="row between"><b>جمع</b><b id="cartTotal"></b></div><a class="btn" style="width:100%;margin-top:16px" href="checkout.html">ادامه و تسویه</a></aside>
<main><section><div class="container" id="productDetail"></div></section><section><div class="container"><h2>نظر مشتریان</h2><div class="grid"><div class="panel"><div class="stars">★★★★★</div><b>سارا</b><p class="muted">کیفیت قهوه عالی و بالانس طعم خیلی خوب بود.</p></div><div class="panel"><div class="stars">★★★★★</div><b>آرمان</b><p class="muted">بسته‌بندی و آماده‌سازی سریع.</p></div><form class="panel" id="reviewForm"><h3>ثبت Review</h3><label class="field">امتیاز<select><option>5</option><option>4</option><option>3</option></select></label><label class="field">نظر<textarea required></textarea></label><button class="btn">ثبت نظر</button></form></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>{let id=+new URLSearchParams(location.search).get('id')||1,p=products.find(x=>x.id===id),b=document.querySelector('#productDetail');b.innerHTML=`<div class="hero-grid"><img src="${p.img}" alt="${p.n}"><div><span class="badge">★ ${p.rate}</span><h1>${p.n}</h1><p>${p.d}</p><h2 class="price">${money(p.p)}</h2><div class="chips"><span class="chip">Arabica</span><span class="chip">Medium Roast</span><span class="chip">Fresh</span></div><button class="btn" style="margin-top:20px" onclick="addCart(${p.id})">افزودن به سبد</button></div></div>`;document.querySelector('#reviewForm').onsubmit=e=>{e.preventDefault();toast('نظر شما ثبت شد');e.target.reset()}})</script></main><div id="toast" class="toast"></div><footer class="footer"><div class="container row between"><b>Ashkan Café</b><span class="muted">© 2026 — تجربه دیجیتال کافه</span><div class="row"><a href="qr-menu.html">QR Menu</a><a href="index.html#reserve">رزرو</a></div></div></footer>
