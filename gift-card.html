<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift-Card | Ashkan Café</title><meta name="description" content="Gift-Card در Ashkan Café"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/v3.css"><link rel="stylesheet" href="css/premium.css"><script defer src="js/v3.js"></script><script defer src="js/i18n.js"></script><script defer src="js/premium.js"></script><script defer src="js/assistant.js"></script><script>try{document.documentElement.lang=localStorage.getItem("lang")==="fa"?"fa":"en";document.documentElement.dir=document.documentElement.lang==="fa"?"rtl":"ltr"}catch(e){}</script><link rel="stylesheet" href="css/stage4.css"><link rel="stylesheet" href="css/stage5.css"></head><body><main><section><div class="container" style="max-width:900px"><span class="eyebrow">DIGITAL GIFT</span><h1>کارت هدیه دیجیتال</h1><div class="hero-grid"><div class="panel" style="background:linear-gradient(135deg,#8b4b2f,#d99552);color:white;min-height:280px"><small>ASHKAN CAFÉ GIFT CARD</small><h2 id="giftName">برای یک دوست خاص</h2><h1 id="giftValue">۵۰۰٬۰۰۰ تومان</h1><p id="giftMsg">یک فنجان حال خوب مهمان من ☕</p></div><form class="panel" id="giftForm"><label class="field">نام گیرنده<input id="gname"></label><label class="field">مبلغ<select id="gvalue"><option value="500000">۵۰۰ هزار تومان</option><option value="1000000">۱ میلیون تومان</option><option value="2000000">۲ میلیون تومان</option></select></label><label class="field">پیام<textarea id="gmsg"></textarea></label><button class="btn">ساخت کارت هدیه</button></form></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>document.querySelector('#giftForm').onsubmit=e=>{e.preventDefault();document.querySelector('#giftName').textContent='برای '+(document.querySelector('#gname').value||'یک دوست خاص');document.querySelector('#giftValue').textContent=money(+document.querySelector('#gvalue').value);document.querySelector('#giftMsg').textContent=document.querySelector('#gmsg').value||'یک فنجان حال خوب مهمان من ☕';toast('Gift Card ساخته شد')})</script></main></body></html>
